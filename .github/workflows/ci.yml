name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunes 06:17 UTC: el benchmark de CVEs reales, que baja paquetes de npm.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Build, tests y benchmark
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar (tsc -b)
        run: npm run build
      - name: Tests (core + viz, incluye CLI de punta a punta)
        run: npm test
      - name: Benchmark sintético (falla si algún caso se clasifica mal)
        run: npm run benchmark
      - name: Build de la versión web
        run: npm run viz:build

  neo4j:
    name: Motor Neo4j
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/graphsast-dev
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphsast-dev 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Mismos hallazgos que el motor en memoria, contra una base real
        run: npx vitest run src/store/neo4j.integration.test.ts
        working-directory: packages/core
        env:
          NEO4J_URI: bolt://localhost:7687

  cve:
    name: Benchmark sobre CVEs reales
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correr el corpus congelado (eval-cve-corpus.json)
        run: npm run cve:run
        env:
          CVE_JSON: cve-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cve-report
          path: cve-report.json
